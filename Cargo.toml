[workspace]
resolver = "2"
members = ["crates/note-core", "crates/note-plugin", "crates/note-cli", "crates/note-registry", "crates/note-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
