# XcodeGen 스펙. macOS 에서: brew install xcodegen && ios/build-ios.sh && cd ios && xcodegen && open PluginNote.xcodeproj
name: PluginNote
options:
  bundleIdPrefix: dev.pluginnote
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"        # iPad 전용
targets:
  PluginNote:
    type: application
    platform: iOS
    sources:
      - path: PluginNote
      # 번들 플러그인(모어원, 보, SFD/BMD 등)을 앱에 포함. 폴더 구조 유지
      - path: ../plugins
        type: folder
        buildPhase: resources
    dependencies:
      - framework: NoteFFI.xcframework
        embed: false
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.yngboson.pluginnote.app   # 실기기 서명용(Personal Team 은 고유 ID 필요)
        DEVELOPMENT_TEAM: 63548MT4PV                             # Personal Team. 다른 계정이면 교체
